name: QuickPizza load suite

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  load-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.2.0'
          browser: true

      - name: Start a private QuickPizza instance for load tests
        run: docker run -d --name quickpizza -p 3333:3333 ghcr.io/grafana/quickpizza-local:latest

      - name: Wait for QuickPizza
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3333/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "QuickPizza did not become ready in time" >&2
          exit 1

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run load test
        run: BASE_URL=http://localhost:3333 npm run test:load -- --summary-export=reports/load-summary.json

      - name: Run stress test
        run: BASE_URL=http://localhost:3333 ALLOW_HEAVY_TESTS=true npm run test:stress -- --summary-export=reports/stress-summary.json

      - name: Run spike test
        run: BASE_URL=http://localhost:3333 ALLOW_HEAVY_TESTS=true npm run test:spike -- --summary-export=reports/spike-summary.json

      - name: Run soak test
        run: BASE_URL=http://localhost:3333 ALLOW_HEAVY_TESTS=true npm run test:soak -- --summary-export=reports/soak-summary.json

      - name: Run browser test
        run: BASE_URL=http://localhost:3333 npm run test:browser -- --summary-export=reports/browser-summary.json

      - name: Upload k6 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-quickpizza-load-suite
          path: reports/
          retention-days: 30
          if-no-files-found: warn
