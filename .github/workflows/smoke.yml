name: QuickPizza smoke
run-name: k6 smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.2.0'

      - name: Run QuickPizza smoke scenario
        run: npm run test:smoke
